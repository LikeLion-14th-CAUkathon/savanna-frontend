<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 파비콘을 바꾸면 파일 이름의 버전도 바꾼다. (favicon-v3.png 등)
         Safari는 주소 뒤 ?v= 값만 바꿔서는 예전 파비콘을 계속 보여준다. -->
    <link rel="icon" type="image/png" href="/favicon-v2.png" />
    <!-- Safari(특히 iOS 탭 목록·즐겨찾기)는 아래 아이콘과 /favicon.ico를 따로 찾는다.
         파일이 없으면 vercel.json 규칙 때문에 HTML이 응답돼 예전 아이콘이 남으므로 public에 실제 파일을 둔다. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pretendard 폰트: CSS @import 대신 여기서 불러와 다른 파일과 동시에 받는다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <meta
      name="description"
      content="흩어졌던 팀을 다시 모아 우리의 다음 원정을 시작해요. 공모전 탐색부터 팀 준비까지 함께하는 사바나 원정."
    />
    <!-- 링크 공유 미리보기(카카오톡 등): 미리보기 봇은 JS를 실행하지 않아 여기에 직접 적는다. -->
    <meta property="og:url" content="https://savanna-expedition.vercel.app/" />
    <meta property="og:title" content="사바나 원정" />
    <meta property="og:description" content="우리 프로젝트에 맞는 공고를 찾고, 다음 도전을 함께 준비해요!" />
    <meta property="og:image" content="https://savanna-expedition.vercel.app/og-image.png" />
    <title>사바나 원정</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
